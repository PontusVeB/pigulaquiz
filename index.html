<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PigułaQuiz – Egzamin Pielęgniarstwo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #272b2e;
  --surface: #2f3438;
  --surface2: #383d41;
  --border: #464c51;
  --accent: #2dd4bf;
  --accent2: #99f6e4;
  --danger: #f87171;
  --success: #34d399;
  --warn: #fbbf24;
  --text: #f0faf8;
  --muted: #8ba8a3;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
  overflow-x: hidden;
}

/* BG gradient */
body::before {
  content: '';
  position: fixed;
  top: -40%;
  left: -20%;
  width: 80vw;
  height: 80vw;
  background: radial-gradient(circle, rgba(45,212,191,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 24px 16px 80px; }

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 40px 0 32px;
}
.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.8rem, 6vw, 2.8rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
  margin-bottom: 8px;
}
.header p {
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 300;
}

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
}

/* ── SETUP SCREEN ── */
#screen-setup { animation: fadeUp 0.4s ease; }
.setup-label {
  font-family: 'Syne', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.count-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.count-btn {
  background: var(--surface2);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.count-btn:hover { border-color: var(--accent); color: var(--accent); }
.count-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.custom-row {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
}
.custom-row input {
  flex: 1;
  background: var(--surface2);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
}
.custom-row input:focus { border-color: var(--accent); }
.custom-row input::placeholder { color: var(--muted); }

.info-row {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 24px;
  padding: 12px 16px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
}
.info-row span { font-weight: 500; color: var(--text); }

/* ── GENERATE BUTTON ── */
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, #0d9488, #0f766e);
  color: #fff;
  border: none;
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  padding: 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.05em;
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-secondary {
  width: 100%;
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.05em;
  margin-top: 10px;
}
.btn-secondary:hover { background: rgba(79,142,247,0.1); }

/* ── LOADING SCREEN ── */
#screen-loading { text-align: center; padding: 60px 24px; animation: fadeUp 0.4s ease; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 24px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 8px;
}
.loading-sub { color: var(--muted); font-size: 0.9rem; }
.progress-bar-wrap {
  background: var(--surface2);
  border-radius: 99px;
  height: 6px;
  margin: 24px 0 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.5s ease;
  width: 0%;
}
.progress-text { color: var(--muted); font-size: 0.8rem; }

/* ── QUIZ SCREEN ── */
#screen-quiz { animation: fadeUp 0.3s ease; }

.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 8px;
}
.quiz-counter {
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.quiz-counter strong { color: var(--accent); }

.quiz-progress {
  height: 4px;
  background: var(--surface2);
  border-radius: 99px;
  margin-bottom: 24px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.4s ease;
}

.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
}
.question-num {
  font-family: 'Syne', sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}
.question-text {
  font-size: clamp(0.95rem, 3vw, 1.1rem);
  font-weight: 500;
  line-height: 1.5;
  color: var(--text);
}

.answers-list { display: flex; flex-direction: column; gap: 10px; }
.answer-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 400;
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  line-height: 1.4;
}
.answer-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: rgba(79,142,247,0.06);
}
.answer-letter {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--accent);
  min-width: 20px;
  padding-top: 1px;
}
.answer-btn.correct {
  border-color: var(--success);
  background: rgba(79,207,133,0.08);
}
.answer-btn.correct .answer-letter { color: var(--success); }
.answer-btn.wrong {
  border-color: var(--danger);
  background: rgba(247,90,90,0.08);
}
.answer-btn.wrong .answer-letter { color: var(--danger); }
.answer-btn:disabled { cursor: default; }

.explanation {
  background: var(--surface2);
  border-left: 3px solid var(--accent2);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  padding: 14px 16px;
  margin-top: 16px;
  font-size: 0.9rem;
  color: var(--accent2);
  line-height: 1.5;
  display: none;
}
.explanation.show { display: block; animation: fadeUp 0.2s ease; }

.next-btn {
  width: 100%;
  background: var(--surface2);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  padding: 15px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 12px;
  letter-spacing: 0.05em;
  display: none;
}
.next-btn:hover { border-color: var(--accent); color: var(--accent); }
.next-btn.show { display: block; animation: fadeUp 0.2s ease; }
@media (max-width: 680px) {
  .next-btn.show {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    border-radius: 0;
    border-left: none; border-right: none; border-bottom: none;
    margin: 0;
    z-index: 100;
    padding: 18px;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    color: var(--accent);
    box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
  }
  #screen-quiz { padding-bottom: 80px; }
}

/* ── RESULTS SCREEN ── */
#screen-results { text-align: center; animation: fadeUp 0.5s ease; }
.result-circle {
  width: 140px; height: 140px;
  border-radius: 50%;
  margin: 0 auto 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}
.result-circle svg {
  position: absolute;
  top: 0; left: 0;
  transform: rotate(-90deg);
}
.result-pct {
  font-family: 'Syne', sans-serif;
  font-size: 2rem;
  font-weight: 800;
  position: relative;
  z-index: 1;
}
.result-label {
  font-size: 0.75rem;
  color: var(--muted);
  position: relative;
  z-index: 1;
  margin-top: -2px;
}
.result-grade {
  font-family: 'Syne', sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 8px;
}
.result-score {
  color: var(--muted);
  font-size: 1rem;
  margin-bottom: 32px;
}
.result-score strong { color: var(--text); font-size: 1.2rem; }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
  text-align: left;
}
.stat-item {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 16px;
}
.stat-val {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  margin-bottom: 4px;
}
.stat-name { color: var(--muted); font-size: 0.8rem; }

/* ── REVIEW ── */
.review-list { text-align: left; }
.review-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin-bottom: 10px;
}
.review-item.ok { border-left: 3px solid var(--success); }
.review-item.fail { border-left: 3px solid var(--danger); }
.review-q { font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
.review-a { font-size: 0.9rem; font-weight: 500; }
.review-a.ok { color: var(--success); }
.review-a.fail { color: var(--danger); }
.review-correct { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
.review-correct strong { color: var(--accent2); }

/* ── TOGGLE REVIEW ── */
.toggle-review-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 24px;
  transition: all 0.2s;
}
.toggle-review-btn:hover { color: var(--text); border-color: var(--accent); }

/* ── CACHE STATUS ── */
.cache-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 500;
  margin-bottom: 16px;
}
.cache-badge.ready { background: rgba(79,207,133,0.12); color: var(--success); }
.cache-badge.missing { background: rgba(247,90,90,0.12); color: var(--danger); }
.cache-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── UTILITY ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hidden { display: none !important; }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* mobile tweaks */
@media (max-width: 420px) {
  .count-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .count-btn { padding: 12px 4px; font-size: 1rem; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header" id="main-header">
    <h1>Pigułа<span style="-webkit-text-fill-color:var(--danger);color:var(--danger)">Quiz</span></h1>
    <p>Egzamin teoretyczny pielęgniarstwo 2026</p>
  </div>

  <!-- SCREEN: SETUP -->
  <div id="screen-setup">
    <div class="card">
      <div class="setup-label">Ile pytań?</div>
      <div class="count-grid">
        <button class="count-btn" onclick="selectCount(10)">10</button>
        <button class="count-btn active" onclick="selectCount(20)">20</button>
        <button class="count-btn" onclick="selectCount(30)">30</button>
        <button class="count-btn" onclick="selectCount(50)">50</button>
        <button class="count-btn" onclick="selectCount(100)">100</button>
        <button class="count-btn" onclick="selectCount(200)">200</button>
        <button class="count-btn" onclick="selectCount(500)">500</button>
        <button class="count-btn" onclick="selectCount(952)">ALL</button>
      </div>
      <div class="custom-row">
        <input type="number" id="custom-input" placeholder="Wpisz własną liczbę (1–952)" min="1" max="952"
          oninput="selectCount(parseInt(this.value)||0, true)">
      </div>
      <div class="info-row">
        <span>Wybrana liczba pytań:</span>
        <span id="count-display">20</span>
      </div>
      <button class="btn-primary" id="start-btn" onclick="startQuiz()">▶ Rozpocznij test</button>
    </div>
  </div>

  <!-- SCREEN: LOADING / GENERATING -->
  <div id="screen-loading" class="hidden">
    <div class="spinner"></div>
    <div class="loading-title" id="loading-title">Generowanie dystraktorów…</div>
    <div class="loading-sub" id="loading-sub">To zajmie chwilę, zrób to tylko raz</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
    <div class="progress-text" id="progress-text">0 / 952</div>
  </div>

  <!-- SCREEN: QUIZ -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-top">
      <div style="display:flex;align-items:center;gap:10px;flex:1;">
        <span style="font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;">Pigułа<span style="-webkit-text-fill-color:var(--danger);color:var(--danger)">Quiz</span></span>
        <div class="quiz-counter">Pytanie <strong id="q-current">1</strong> z <strong id="q-total">20</strong></div>
      </div>
      <div class="quiz-counter" id="q-score-live">✓ 0 &nbsp;✗ 0</div>
    </div>
    <div class="quiz-progress">
      <div class="quiz-progress-fill" id="quiz-prog-fill" style="width:0%"></div>
    </div>
    <div class="question-card">
      <div class="question-num" id="q-num" style="display:flex;justify-content:space-between;align-items:center;"><span>Pytanie 1</span><span id="q-badge" style="font-size:0.65rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;letter-spacing:0.02em;">[Q1]</span></div>
      <div class="question-text" id="q-text"></div>
    </div>
    <div class="answers-list" id="answers-list"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Następne pytanie →</button>
  </div>

  <!-- SCREEN: RESULTS -->
  <div id="screen-results" class="hidden">
    <div class="card">
      <div class="result-circle" id="result-circle">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#1e2336" stroke-width="10"/>
          <circle cx="70" cy="70" r="60" fill="none" stroke-width="10"
            stroke-linecap="round"
            id="result-arc"
            stroke-dasharray="377"
            stroke-dashoffset="377"
            style="transition: stroke-dashoffset 1s ease;"/>
        </svg>
        <div class="result-pct" id="result-pct">0%</div>
        <div class="result-label">wynik</div>
      </div>
      <div class="result-grade" id="result-grade"></div>
      <div class="result-score" id="result-score"></div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-val" style="color:var(--success)" id="res-correct">0</div>
          <div class="stat-name">Poprawnych</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" style="color:var(--danger)" id="res-wrong">0</div>
          <div class="stat-name">Błędnych</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="res-total">0</div>
          <div class="stat-name">Pytań łącznie</div>
        </div>
        <div class="stat-item">
          <div class="stat-val" id="res-time">0:00</div>
          <div class="stat-name">Czas</div>
        </div>
      </div>
      <button class="btn-primary" onclick="restartQuiz()">↺ Nowy test</button>
      <button class="btn-secondary" onclick="toggleReview()">📋 Przejrzyj odpowiedzi</button>
    </div>
    <div id="review-section" class="hidden">
      <hr class="divider">
      <div class="review-list" id="review-list"></div>
    </div>
  </div>

</div>

<footer style="text-align:center;padding:32px 0 8px;color:var(--muted);font-size:0.8rem;letter-spacing:0.04em;">
  <span style="color:var(--accent);font-weight:600">Piotr</span> 2026 &nbsp;<span style="font-size:0.7rem;opacity:0.5;letter-spacing:0.05em;">v0.1.0</span>
</footer>

<script>
// ── DATA ──

// ── STATE ──
let selectedCount = 20;
let quizQuestions = [];
let currentIdx = 0;
let score = 0;
let wrongCount = 0;
let answered = false;
let startTime = null;
let userAnswers = [];
let reviewVisible = false;

// ── SETUP UI ──
function selectCount(n, fromInput) {
  if (!fromInput) {
    document.getElementById('custom-input').value = '';
    document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
    const counts = [10,20,30,50,100,200,500,952];
    const idx = counts.indexOf(n);
    if (idx >= 0) document.querySelectorAll('.count-btn')[idx].classList.add('active');
  }
  selectedCount = Math.min(Math.max(n||0, 1), 952);
  document.getElementById('count-display').textContent = selectedCount || '?';
}

// ── QUIZ START ──

// ── START QUIZ ──
function startQuiz() {
  document.getElementById('main-header').style.display = 'none';
  if (!selectedCount || selectedCount < 1) { alert('Wybierz liczbę pytań!'); return; }
  // Shuffle and pick
  const shuffled = [...QUESTIONS_BASE].sort(() => Math.random() - 0.5);
  const picked = shuffled.slice(0, Math.min(selectedCount, QUESTIONS_BASE.length));

  quizQuestions = picked.map(q => {
    // Options and correct index already pre-built and shuffled
    return { ...q, options: q.o, correctIndex: q.a, question: q.q, correct: q.o[q.a] };
  });

  currentIdx = 0;
  score = 0;
  wrongCount = 0;
  userAnswers = [];
  startTime = Date.now();

  showScreen('quiz');
  renderQuestion();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── RENDER QUESTION ──
function renderQuestion() {
  const q = quizQuestions[currentIdx];
  answered = false;

  document.getElementById('q-current').textContent = currentIdx + 1;
  document.getElementById('q-total').textContent = quizQuestions.length;
  document.getElementById('q-num').querySelector('span:first-child').textContent = `Pytanie ${currentIdx + 1}`;
  document.getElementById('q-badge').textContent = `[Q${q.id}]`;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('q-score-live').innerHTML = `✓ ${score} &nbsp;✗ ${wrongCount}`;

  const pct = (currentIdx / quizQuestions.length) * 100;
  document.getElementById('quiz-prog-fill').style.width = pct + '%';

  const list = document.getElementById('answers-list');
  list.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="answer-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i, btn, q);
    list.appendChild(btn);
  });

  document.getElementById('explanation').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');
}

function selectAnswer(idx, btn, q) {
  if (answered) return;
  answered = true;

  const isCorrect = idx === q.correctIndex;
  const buttons = document.querySelectorAll('.answer-btn');
  buttons.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    buttons[q.correctIndex].classList.add('correct');
    wrongCount++;
  }

  userAnswers.push({ q, chosen: idx, correct: isCorrect });

  const exp = document.getElementById('explanation');
  exp.textContent = isCorrect ? `✓ Poprawnie! ${q.correct}` : `✗ Poprawna odpowiedź: ${q.correct}`;
  exp.classList.add('show');

  document.getElementById('q-score-live').innerHTML = `✓ ${score} &nbsp;✗ ${wrongCount}`;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const nextBtn = document.getElementById('next-btn');
  if (currentIdx < quizQuestions.length - 1) {
    nextBtn.textContent = 'Następne pytanie →';
  } else {
    nextBtn.textContent = 'Zobacz wyniki ✓';
  }
  nextBtn.classList.add('show');
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizQuestions.length) {
    showResults();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── RESULTS ──
function showResults() {
  showScreen('results');
  reviewVisible = false;
  document.getElementById('review-section').classList.add('hidden');

  const total = quizQuestions.length;
  const pct = Math.round(score / total * 100);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  // Grade
  let grade, gradeColor;
  if (pct === 100) { grade = '🧠 Jezus Maria, wszystko?! Ty chyba nie śpisz w ogóle.'; gradeColor = 'var(--success)'; }
  else if (pct >= 90) { grade = '🏆 K**rwa, geniusz. Serio.'; gradeColor = 'var(--success)'; }
  else if (pct >= 80) { grade = '💪 Bardzo dobrze! Prawie geniusz, ale bez przesady.'; gradeColor = 'var(--success)'; }
  else if (pct >= 70) { grade = '👍 Nieźle, da się zdać. Ale mogłoby być lepiej.'; gradeColor = 'var(--accent)'; }
  else if (pct >= 60) { grade = '😅 No ledwo ledwo... ale przechodzi!'; gradeColor = 'var(--warn)'; }
  else if (pct >= 50) { grade = '📚 Hm. Jeszcze trochę i może coś z tego będzie.'; gradeColor = 'var(--warn)'; }
  else if (pct >= 30) { grade = '💀 Tragedia. Zamknij Netflixa i otwórz książkę.'; gradeColor = 'var(--danger)'; }
  else { grade = '📱 Więcej TikToka, gamoniu? Serio?'; gradeColor = 'var(--danger)'; }

  document.getElementById('result-pct').textContent = pct + '%';
  const el = document.getElementById('result-grade');
  el.textContent = grade;
  el.style.color = gradeColor;
  document.getElementById('result-score').innerHTML = `<strong>${score} / ${total}</strong> poprawnych odpowiedzi`;
  document.getElementById('res-correct').textContent = score;
  document.getElementById('res-wrong').textContent = wrongCount;
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-time').textContent = `${mins}:${secs.toString().padStart(2,'0')}`;

  // Arc
  const arcColor = pct >= 75 ? 'var(--success)' : pct >= 60 ? 'var(--warn)' : 'var(--danger)';
  const arc = document.getElementById('result-arc');
  arc.style.stroke = arcColor;
  setTimeout(() => {
    arc.style.strokeDashoffset = 377 - (377 * pct / 100);
  }, 100);

  // Review
  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';
  userAnswers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (a.correct ? 'ok' : 'fail');
    const letters = ['A','B','C','D'];
    const chosenText = a.q.options[a.chosen];
    div.innerHTML = `
      <div class="review-q">${i+1}. ${a.q.question}</div>
      <div class="review-a ${a.correct ? 'ok' : 'fail'}">${a.correct ? '✓' : '✗'} ${chosenText}</div>
      ${!a.correct ? `<div class="review-correct">Poprawna: <strong>${a.q.correct}</strong></div>` : ''}
    `;
    reviewList.appendChild(div);
  });
}

function toggleReview() {
  reviewVisible = !reviewVisible;
  document.getElementById('review-section').classList.toggle('hidden', !reviewVisible);
  if (reviewVisible) document.getElementById('review-section').scrollIntoView({ behavior: 'smooth' });
}

function restartQuiz() {
  document.getElementById('main-header').style.display = '';
  showScreen('setup');
  updateCacheStatus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── SCREEN MANAGEMENT ──
function showScreen(name) {
  ['setup','loading','quiz','results'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
  });
}

// ── INIT ──
selectCount(20);
</script>
